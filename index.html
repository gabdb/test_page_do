<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Sales Coaching Routines</title>
<style>
:root{--brand:#FFE600;--gold:#E8B52A;--side:#141414;--bg:#f3f3f3;--card:#fff;--text:#1d1d1d;--muted:#6b6b6b;--line:#e2e2e2;--ok:#17743f;--bad:#c4271c;--warn:#8a5a00;--f:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--f)}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.app{display:flex;min-height:100vh}
nav{width:270px;background:var(--side);color:#fff;display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh;padding:8px 0 0}
.brand{display:flex;gap:12px;align-items:center;padding:6px 14px 26px}.brand img{width:68px;height:68px}.brand b{font-size:19px;line-height:1.2;font-weight:600}
nav button.it{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:14px;width:100%;padding:12px 16px;color:#b5b5b5;font-weight:500}
nav button.it svg{color:var(--brand)}nav button.it.g{color:#fff;font-weight:700}nav button.it.g .chev{margin-left:auto;width:18px}
nav button.it.sub{padding-left:34px;color:#fff;font-weight:600;font-size:14px}nav button.it.sub.off{color:#b5b5b5;font-weight:500}
nav button.it.sup svg{color:#b5b5b5}nav button.it:hover{background:#1f1f1f}
.foot{margin-top:auto;border-top:1px solid #333;margin-inline:12px;padding:14px 0 16px;font-size:13px;display:flex;gap:10px;align-items:center}
.av{width:36px;height:36px;border-radius:50%;background:var(--gold);color:#111;font-weight:700;display:grid;place-items:center;flex-shrink:0}
.foot select{background:#222;color:#fff;border:1px solid #444;border-radius:6px;padding:4px;width:100%;font-size:12px;margin-top:4px}
:focus-visible{outline:3px solid #2a5fc4;outline-offset:2px}
.mw{flex:1;min-width:0}
.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px;gap:10px}
.bc{font-size:18px;color:var(--muted)}.bc b{color:var(--text);font-weight:600}.bc i{margin:0 12px;font-style:normal}
.lang{border:1px solid #cfcfcf;border-radius:8px;padding:9px 12px;background:#fff;font:inherit}
main{padding:28px 32px 40px;max-width:1300px}
.pt{display:flex;align-items:center;gap:14px;font-size:27px;font-weight:500;margin:0 0 20px}.pt svg{width:30px;height:30px}.pt .sp{flex:1}
.panel{background:#fff;border-radius:6px;padding:18px;margin-bottom:22px}
.ctl{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.seg{display:flex;background:#f1f1f1;border-radius:8px;overflow:hidden;border:1px solid var(--line)}.seg button{all:unset;cursor:pointer;padding:10px 14px;display:grid;place-items:center}.seg button.on{background:#dedede}
select,input,textarea{font:inherit;color:var(--text);background:#fff;border:1px solid #cfcfcf;border-radius:8px;padding:9px 12px;width:100%}
.ctl select{width:225px;border-radius:12px;padding:14px 16px}
.srch{display:flex;align-items:center;gap:10px;border:1px solid #cfcfcf;border-radius:30px;padding:0 18px;width:min(380px,100%);color:var(--muted)}.srch input{border:0;padding:13px 0;outline-offset:6px}
.tabs{display:flex;background:#ececec;border:1px solid #d8d8d8;border-radius:8px;margin-top:18px;overflow-x:auto;width:fit-content;max-width:100%}
.tabs button{all:unset;cursor:pointer;padding:14px 24px;white-space:nowrap;font-weight:500}.tabs button.on{background:linear-gradient(90deg,var(--gold),var(--brand));font-weight:700}
.cards{display:grid;gap:22px;grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}.cards.list{grid-template-columns:1fr}
.c{background:#fff;border-radius:12px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.08);display:flex;flex-direction:column}
.ban{background:#000;color:#fff;border-radius:8px;min-height:112px;display:grid;place-items:center;text-align:center;font-size:20px;font-weight:700;padding:14px}
.meta{padding:14px 0 6px;flex:1}.meta p{margin:2px 0}.m1{color:var(--muted)}.m2{font-weight:700}.m3{color:var(--muted)}
.sep{border-top:1px solid var(--line);margin:8px 0 14px}
.vb{font:inherit;font-weight:600;border:1px solid #cfcfcf;background:#e4e5ea;border-radius:8px;padding:12px;width:100%;cursor:pointer}.vb:hover{background:#d8d9df}.vb:disabled{opacity:.55;cursor:default}
.btn{font:inherit;font-weight:700;border:0;border-radius:8px;padding:10px 18px;cursor:pointer;background:linear-gradient(90deg,var(--gold),var(--brand));color:#111}
.kpis{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:22px}
.kpi{background:#fff;border-radius:12px;padding:16px;border-top:5px solid var(--gold);box-shadow:0 2px 10px rgba(0,0,0,.06)}.kpi.bad{border-top-color:var(--bad)}.kpi.ok{border-top-color:var(--ok)}
.kpi strong{display:block;font-size:32px;line-height:1.1}.kpi span{color:var(--muted);font-size:13px}
.box{background:#fff;border-radius:12px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.06)}.box h3{margin:0 0 8px;font-size:17px}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}.row small{color:var(--muted);display:block}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;background:#e6e6e6;white-space:nowrap}
.b-todo,.b-low{background:#e0e8fb;color:#244a99}.b-doing,.b-mid{background:#fff1b8;color:var(--warn)}.b-done{background:#d6f0e1;color:var(--ok)}.b-late,.b-high{background:#fbdad6;color:var(--bad)}
.bar{height:8px;background:#e4e4e4;border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--gold)}
.empty{text-align:center;color:var(--muted);padding:26px 8px}
.f{margin-bottom:12px}label{display:block;font-weight:600;font-size:13px;margin-bottom:4px}.two{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.scale{display:flex;gap:6px}.scale label{flex:1;font-weight:500;text-align:center;border:1px solid #cfcfcf;border-radius:8px;padding:9px 0;cursor:pointer;margin:0}.scale input{display:none}.scale label:has(input:checked){background:linear-gradient(90deg,var(--gold),var(--brand));font-weight:700}
.req,.err{color:var(--bad)}.err{font-size:12px}
.ex{background:#f7f7f7;border-radius:8px;padding:10px 14px;margin-bottom:8px;font-size:14px}.ex ol{margin:4px 0 8px;padding-left:20px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:#111;color:#fff;padding:11px 18px;border-radius:9px;z-index:9;border-left:6px solid var(--brand);font-weight:600}
@media(max-width:860px){.app{flex-direction:column}nav{width:100%;height:auto;flex-direction:row;overflow-x:auto;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding:0}.brand,nav .g{display:none}nav button.it.sub{padding-left:16px;white-space:nowrap;width:auto}.foot{display:none}.topbar{padding:0 16px;height:60px}main{padding:18px 14px}.bc{font-size:15px}}
.brand .logo{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--brand));color:#111;font-weight:800;font-size:18px;display:grid;place-items:center;flex-shrink:0}
.proto{background:#111;color:var(--brand);text-align:center;font-size:13px;font-weight:600;padding:7px 12px}
.bc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
a.btn{text-decoration:none;display:inline-block;white-space:nowrap}
[hidden]{display:none!important}
.pt .btn{font-size:15px}
@media(max-width:860px){nav button.it.g{display:none}.pt{font-size:22px}}
</style></head>
<body><div class="app">
<nav aria-label="Main navigation"><div class="brand"><div class="logo" aria-hidden="true">SC</div><b>Sales Coaching Routines</b></div><div id="menu" style="display:contents"></div>
<div class="foot"><div class="av" id="av"></div><div style="flex:1;min-width:0"><div id="nm"></div><div id="ps"></div><div>Country: France</div><select id="role" aria-label="Switch profile (demo)"></select></div></div></nav>
<div class="mw"><div class="proto">Prototype · fictitious data · nothing you enter is saved</div><div class="topbar"><div class="bc" id="bc"></div><a id="fb" class="btn" target="_blank" rel="noopener" hidden>Give feedback</a></div><main id="main"></main></div></div><div id="toast" class="toast" hidden></div>
<script>
/* ===================== À MODIFIER =====================
   Colle ici le lien de ton Microsoft Forms, entre les guillemets.
   Exemple : const FEEDBACK_URL="https://forms.office.com/r/xxxxxxx";
   Laisse "" pour masquer le bouton "Give feedback".
   ====================================================== */
const FEEDBACK_URL="";

const IC={book:'<svg viewBox="0 0 24 24"><path d="M3 5h6a3 3 0 0 1 3 3v11a2 2 0 0 0-2-2H3zM21 5h-6a3 3 0 0 0-3 3v11a2 2 0 0 1 2-2h7z"/></svg>',head:'<svg viewBox="0 0 24 24"><path d="M4 14v-2a8 8 0 0 1 16 0v2M4 14h3v5H4zM20 14h-3v5h3z"/></svg>',chev:'<svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>',grid:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="13" height="13" rx="2"/><path d="M8 20h11a2 2 0 0 0 2-2V8"/></svg>',list:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="5" height="5" rx="1"/><rect x="3" y="14" width="5" height="5" rx="1"/><path d="M12 6h9M12 11h9M12 16h9"/></svg>',search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/></svg>',act:'<svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="7"/><path d="M5 10h3l1.5-3 2 6 1.5-3h2M21 21l-6-6"/></svg>',out:'<svg viewBox="0 0 24 24"><path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/></svg>'};
const TODAY=new Date();TODAY.setHours(12,0,0,0);const iso=x=>x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");const d=n=>{const x=new Date(TODAY);x.setDate(x.getDate()+n);return iso(x)};
const fr=s=>new Date(s).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
const MG=["Claire Dubois","Vacant Nord","Thomas Lefèvre","Nadia Benali","Julien Moreau","Camille Laurent","Hugo Garnier"].map((n,i)=>({id:i+1,n,v:n.startsWith("Vacant")}));
const L1={1:["Lucas Petit","Emma Rousseau","Léa Fontaine","Nathan Girard","Chloé Bonnet","Hugo Lambert","Inès Faure"],
2:["Manon Robin","Théo Chevalier","Sarah Morel","Louis Gauthier","Jade Perrin","Arthur Roux","Zoé Blanc","Paul Henry"],
3:["Clara Mathieu","Maxime Leroy","Lina Fournier","Raphaël Muller","Alice Colin","Tom Renard","Eva Marchand"],
4:["Noah Lemaire","Julie Dumas","Adam Barbier","Margaux Picard","Victor Aubert","Lucie Giraud","Simon Brun","Anaïs Roger"],
5:["Mathis Clément","Pauline Noël","Enzo Gaillard","Océane Masson","Romain Dupont","Elise Caron","Bastien Rivière"],
7:["Quentin Vidal","Laura Meunier","Florian Arnaud","Mélanie Jacquet","Kevin Guérin","Sophie Lacroix"]};
const OR1=["Mathilde Durand","Alexis Bertrand","Juliette Michel","Nicolas Lefort","Elodie Garcia","Benoît Roche"],OR2=["Céline Huet","Damien Collet","Marion Leclerc","Yanis Royer"];
const SP=[];const addT1=(m,n,z)=>{const k=SP.length,o=90+(k*7)%31;SP.push({id:k+1,m,n,z,o,r:Math.round(o*(0.62+((k*17)%46)/100))})};
MG.forEach(m=>{if(m.id==6){OR1.forEach(n=>addT1(6,n,"Paris"));OR2.forEach(n=>addT1(6,n,"Est"))}else L1[m.id].forEach(n=>addT1(m.id,n,""))});
const TPL=[
{id:"121",n:"121",c:"Monthly",days:30,min:45,ag:["How are you doing?","Results of the period","Blockers and support needed","Decisions and actions"],q:["What worked best this month?","Where do you need help?"]},
{id:"coach",n:"Coaching",c:"Every 6 weeks",days:42,min:40,ag:["Field observation","Feedback","Progression plan"],q:["Which customer situation do you want to rework?"]},
{id:"wk",n:"Weekly check-in",c:"Weekly",days:7,min:20,ag:["Priorities of the week","Pipeline at risk"],q:["What is your #1 priority?"]},
{id:"perf",n:"Performance review",c:"Quarterly",days:90,min:60,ag:["Results vs targets","Strengths","Areas to improve","Priorities"],q:["Which result are you proudest of?"]},
{id:"biz",n:"Business review",c:"Quarterly",days:90,min:60,ag:["Key figures","Strategic accounts","Quarterly plan"],q:["Which accounts can over-deliver?"]}];
const S={meetings:[],evals:[],actions:[],fbs:[]};
const AC=["Run 5 prospecting meetings per week","Update the CRM for active accounts","Prepare the offer for a key account","Visit the 8 priority outlets","Prepare the Q4 customer plan","Update the weekly pipeline"],FO=["Great customer relationship","Negotiation","Autonomy","Strong execution in store"],AM=["Prospecting volume","CRM follow-up","Sharing best practices","Account planning"],FB=["Very good momentum","Schedule 5 new prospect meetings per week","Candidate for a referent role","Focus on the top 10 accounts"],CM=["Needs support on key accounts","Motivated by the new portfolio","Wants to grow towards key account","Would like more field coaching"];
SP.forEach((s,i)=>{S.meetings.push({id:i+1,t:i%3?"121":"coach",p:s.id,date:d(1+(i*3)%25),st:"planned"});
if(i%4==0)S.meetings.push({id:200+i,t:"121",p:s.id,date:d(-6-i%5),st:"held"});
S.actions.push({id:i+1,p:s.id,d:AC[i%6],due:d(i%3==0?-(1+i%4):4+i%9),st:i%5==0?"doing":"todo",pr:["high","mid","low"][i%3]});
if(i%5==2)S.actions.push({id:300+i,p:s.id,d:"Close the priority deal",due:d(-8),st:"done",pr:"high"});
if(i%3!=1){const f=FB[i%4];S.evals.push({id:i+1,p:s.id,date:d(-3-(i*2)%20),type:["121","coach","perf"][i%3],score:2+i%4,res:Math.round(s.r/s.o*100)+"% of target",forces:FO[i%4],amel:AM[(i+1)%4],fb:f,com:CM[i%5%4],next:d(10+i%20)});S.fbs.push({p:s.id,date:d(-3-(i*2)%20),t:f})}});
S.fbs.sort((a,b)=>a.date<b.date?1:-1);
const $=s=>document.querySelector(s);
let U={r:"m",id:6},view="dash",tab="all",sel=0,q="",grid=true,tm=0,sched=false,open=true,pre=0;const EX=new Set();
const P=id=>SP.find(s=>s.id==id),T=id=>TPL.find(t=>t.id==id),MN=id=>MG.find(m=>m.id==id).n;
const T1B='<span class="badge b-low">T1</span>';
const base=()=>U.r=="m"?SP.filter(s=>s.m==U.id):SP.filter(s=>s.id==U.id);
const ok=p=>base().some(s=>s.id==p)&&(!sel||p==sel);
const sc=a=>a.filter(x=>ok(x.p));const vis=(a,tx)=>sc(a).filter(x=>!q||(P(x.p).n+" "+tx(x)).toLowerCase().includes(q.toLowerCase()));
const boss=()=>U.r!=="s";
const late=a=>a.st!=="done"&&a.due<d(0);const stt=a=>late(a)?"late":a.st;
const SL={todo:"To do",doing:"In progress",done:"Done",late:"Overdue"},PL={high:"High",mid:"Medium",low:"Low"};
const bd=(c,t)=>`<span class="badge b-${c}">${t}</span>`;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const addDays=(s,n)=>{const x=new Date(s);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2600)}
const LBL={dash:"Dashboard",team:"My T1 team",dir:"Directory",meet:"Meetings",eval:"Evaluation",act:"Action plans",hist:"History",support:"Support"};
const lbl=k=>typeof LBL[k]=="function"?LBL[k](U):LBL[k];
const myName=()=>U.r=="m"?MN(U.id):P(U.id).n;
function nav(){const it=k=>`<button class="it sub ${k==view?"":"off"}" data-v="${k}">${IC.book}${lbl(k)}</button>`;
const keys=["dash",...(boss()?["team","dir"]:[]),"meet","eval","act","hist"];
$("#menu").innerHTML=`<button class="it g" data-o="1">${IC.book}Team Routines${IC.chev}</button>${open?keys.map(it).join(""):""}<button class="it sup" data-v="support">${IC.head}Support</button>`;
$("#role").innerHTML=`<optgroup label="T2 managers">${MG.filter(m=>!m.v).map(m=>`<option value="m${m.id}">T2 · ${m.n}</option>`).join("")}</optgroup><optgroup label="T1 sales reps">${SP.map(s=>`<option value="s${s.id}">T1 · ${s.n}</option>`).join("")}</optgroup>`;
$("#role").value=U.r+U.id;const nn=myName(),sp=nn.indexOf(" ");$("#nm").textContent=U.r=="m"?nn.slice(sp+1)+", "+nn.slice(0,sp):nn;$("#ps").textContent="User Persona: "+(U.r=="m"?"T2 MANAGER":"T1 SALES REP");$("#av").textContent=nn.split(" ").map(x=>x[0]).join("");
$("#bc").innerHTML=`Team Routines<i>&gt;</i><b>${lbl(view)}</b>`}
const go=v=>{view=v;pre=0;tab="all";sel=0;q="";tm=0;sched=false;render()};
document.addEventListener("click",e=>{const g=k=>e.target.closest(`[${k}]`);let b;
if(b=g("data-v")){go(b.dataset.v);if(b.dataset.pre){pre=+b.dataset.pre;render()}return}if(g("data-o")){open=!open;return nav()}
if(b=g("data-t")){tab=b.dataset.t;return render()}if(b=g("data-g")){grid=b.dataset.g=="1";return render()}
if(b=g("data-st")){const x=S.actions.find(z=>z.id==b.dataset.id);x.st="done";toast("Status updated: Done");return render()}
if(b=g("data-ex")){const k=b.dataset.ex;EX.has(k)?EX.delete(k):EX.add(k);return render()}
if(b=g("data-tm")){tm=+b.dataset.tm;return render()}if(g("data-back")){tm=0;return render()}
if(b=g("data-hist")){const n=b.dataset.hist;go("hist");q=n;return render()}
if(g("data-sched")){sched=!sched;return render()}if(g("data-out"))toast("Demo: use the profile switcher to change user")});
document.addEventListener("change",e=>{if(e.target.id=="sel"){sel=+e.target.value;render()}if(e.target.id=="role"){const v=e.target.value;U={r:v[0],id:+v.slice(1)};if(U.r=="s"&&view=="team")view="dash";go(view)}});
document.addEventListener("input",e=>{if(e.target.id=="q"){q=e.target.value;const p=e.target.selectionStart;render();const i=$("#q");i.focus();i.setSelectionRange(p,p)}});
const panel=(tabs,ns)=>{const o=U.r=="m"&&!ns?`<option value="0">All T1</option>`+base().map(s=>`<option value="${s.id}" ${sel==s.id?"selected":""}>${s.n}</option>`).join(""):"";
return `<div class="panel"><div class="ctl"><div class="seg"><button class="${grid?"on":""}" data-g="1" aria-label="Grid view">${IC.grid}</button><button class="${grid?"":"on"}" data-g="0" aria-label="List view">${IC.list}</button></div>${o?`<select id="sel" aria-label="Filter">${o}</select>`:""}<label class="srch">${IC.search}<input id="q" placeholder="Search" aria-label="Search" value="${esc(q)}"></label></div>${tabs?`<div class="tabs">${tabs.map(([k,l])=>`<button class="${tab==k?"on":""}" data-t="${k}">${l}</button>`).join("")}</div>`:""}</div>`};
const head=(t,r="")=>`<h2 class="pt">${IC.act}<span class="sp">${t}</span>${r}</h2>`;
const card=(t,meta,btn,ex="")=>`<article class="c"><div class="ban">${esc(t)}</div><div class="meta">${meta}${ex}</div><div class="sep"></div>${btn}</article>`;
const cards=(a,msg)=>a.length?`<div class="cards ${grid?"":"list"}">${a.join("")}</div>`:`<div class="panel empty">${msg}</div>`;
const who=p=>esc(P(p).n)+" "+T1B;
const evC=e=>{const k="e"+e.id,o=EX.has(k);return card(T(e.type).n,`<p class="m1">${who(e.p)}</p><p class="m2">Date: ${fr(e.date)}</p><p class="m3">Next follow-up: ${fr(e.next)}</p><p>${bd(e.score>=4?"done":e.score==3?"doing":"late","Level "+e.score+"/5")}</p>`,`<button class="vb" data-ex="${k}">${o?"Hide details":"View evaluation"}</button>`,o?`<div class="ex"><b>Results:</b> ${esc(e.res)}<br><b>Strengths:</b> ${esc(e.forces)}<br><b>To improve:</b> ${esc(e.amel)}<br><b>Manager feedback:</b> ${esc(e.fb)}<br><b>T1 comments:</b> ${esc(e.com||"-")}</div>`:"")};
const actC=a=>{const s=stt(a);return card(a.d,`<p class="m1">${who(a.p)}</p><p class="m2">Due: ${fr(a.due)}</p><p>${bd(a.pr,PL[a.pr]+" priority")} ${bd(s,SL[s])}</p>`,a.st=="done"?`<button class="vb" disabled>Completed</button>`:`<button class="vb" data-st="1" data-id="${a.id}">Mark as done</button>`)};
function dash(){const A=sc(S.actions),L=A.filter(late),M=sc(S.meetings).filter(m=>m.st=="planned").sort((a,b)=>a.date>b.date?1:-1);
const need=base().filter(t=>!S.evals.some(e=>e.p==t.id&&e.date>d(-14)));const avg=Math.round(base().reduce((s,t)=>s+t.r/t.o,0)/base().length*100);
return head(U.r=="m"?"Welcome, "+MN(U.id).split(" ")[0]:"Hello "+P(U.id).n,`<button class="btn" data-v="${boss()?"meet":"eval"}">${boss()?"Schedule a meeting":"My evaluations"}</button>`)+
`<div class="kpis"><div class="kpi"><strong>${M.length}</strong><span>Upcoming meetings</span></div><div class="kpi ${L.length?"bad":"ok"}"><strong>${L.length}</strong><span>Overdue actions</span></div>${boss()?`<div class="kpi"><strong>${need.length}</strong><span>Evaluations to complete</span></div>`:""}<div class="kpi ok"><strong>${avg}%</strong><span>${boss()?"Target attainment":"My target attainment"}</span></div></div>
${L.length?`<div class="box" style="border-left:5px solid var(--bad);margin-bottom:18px"><h3>Alerts</h3>${L.slice(0,5).map(a=>`<div class="row"><span>${boss()?esc(P(a.p).n)+": ":""}${esc(a.d)}</span>${bd("late","overdue since "+fr(a.due))}</div>`).join("")}</div>`:""}
<div class="grid"><div class="box"><h3>Upcoming meetings</h3>${M.length?M.slice(0,5).map(m=>`<div class="row"><div><strong>${T(m.t).n}</strong><small>${boss()?esc(P(m.p).n)+" · ":""}${fr(m.date)} · ${T(m.t).c}</small></div></div>`).join(""):`<div class="empty">No meetings scheduled.</div>`}</div>
${boss()?`<div class="box"><h3>Evaluations to complete</h3>${need.length?need.slice(0,5).map(t=>`<div class="row"><span>${esc(t.n)}</span><button class="vb" style="width:auto;padding:6px 14px" data-v="eval" data-pre="${t.id}">Evaluate</button></div>`).join(""):`<div class="empty">All evaluations are up to date.</div>`}</div>`:""}
<div class="box"><h3>Latest feedback</h3>${sc(S.fbs).length?sc(S.fbs).slice(0,6).map(f=>`<div class="row"><div>${boss()?`<strong>${esc(P(f.p).n)}</strong>`:""}<small>${fr(f.date)}</small>${esc(f.t)}</div></div>`).join(""):`<div class="empty">No feedback yet.</div>`}</div></div>`}
function team(){const rg=U.id==6?[["all","All regions"],["Paris","Paris"],["Est","Est"]]:null;
const L=base().filter(s=>(tab=="all"||s.z==tab)&&(!sel||s.id==sel)&&(!q||s.n.toLowerCase().includes(q.toLowerCase())));
return head("My T1 team",`<span class="badge b-low" style="font-size:14px">T2 · ${MN(U.id)} · ${base().length} T1</span>`)+panel(rg)+cards(L.map(s=>{const p=Math.round(s.r/s.o*100),a=S.actions.filter(x=>x.p==s.id&&late(x)).length;return card(s.n,`<p class="m1">${T1B} ${s.z}</p><p class="m2">Target attainment: ${p}%</p><div class="bar"><i style="width:${Math.min(p,100)}%"></i></div><p>${bd(p>=100?"done":p>=85?"doing":"late",p>=100?"Achieved":p>=85?"On track":"At risk")} ${a?bd("late",a+" overdue"):bd("done","No delays")}</p>`,`<button class="vb" data-hist="${esc(s.n)}">View history</button>`)}),"No T1 found.")}
function dir(){const ql=q.toLowerCase();const L=MG.filter(m=>(tab=="all"||tab==m.id)&&(!ql||m.n.toLowerCase().includes(ql)||SP.some(s=>s.m==m.id&&s.n.toLowerCase().includes(ql))));
return head("T2 & T1 directory",`<span class="badge b-low" style="font-size:14px">${MG.filter(m=>!m.v).length} T2 · ${SP.length} T1</span>`)+panel([["all","All T2"],...MG.map(m=>[m.id,m.n])],1)+cards(L.map(m=>{const t=SP.filter(s=>s.m==m.id),regs=[...new Set(t.map(s=>s.z))],me=m.id==U.id;
const body=regs.map(r=>{const x=t.filter(s=>s.z==r);return `<div class="ex"><b>${r?r+" · ":""}${x.length} T1</b><ol>${x.map(s=>`<li>${esc(s.n)}</li>`).join("")}</ol></div>`}).join("");
return card(m.n,`<p class="m1">${m.v?bd("mid","Vacant position"):bd("done","T2 Manager")}</p><p class="m2">${t.length} T1 reporting</p>`,me?`<button class="vb" data-v="team">Open my T1 team</button>`:`<button class="vb" disabled>View only</button>`,body)}),"No match.")}
function meet(){const L=vis(S.meetings,m=>T(m.t).n).filter(m=>tab=="all"||m.t==tab).sort((a,b)=>a.date>b.date?1:-1);
const form=sched&&boss()?`<div class="panel"><form id="mf"><div class="two"><div class="f"><label>Template <span class="req">*</span></label><select name="t" id="tsel">${TPL.map(t=>`<option value="${t.id}">${t.n}</option>`).join("")}</select></div><div class="f"><label>T1 <span class="req">*</span></label><select name="p">${base().map(s=>`<option value="${s.id}">${s.n}</option>`).join("")}</select></div><div class="f"><label>First date <span class="req">*</span></label><input type="date" name="date" min="${d(0)}" required></div></div><div id="tp" class="ex"></div><button class="btn">Create meeting</button></form></div>`:"";
const prep=!boss()?`<div class="panel"><h3 style="margin:0 0 10px">Prepare my next 121</h3><form id="pf"><div class="two"><div class="f"><label>My wins</label><textarea rows="2"></textarea></div><div class="f"><label>My blockers / support request</label><textarea rows="2"></textarea></div></div><button class="btn">Send my preparation</button></form></div>`:"";
return head("Meetings",boss()?`<button class="btn" data-sched="1">Schedule a meeting</button>`:"")+form+prep+panel([["all","All"],...TPL.map(t=>[t.id,t.n])])+cards(L.map(m=>{const t=T(m.t),k="m"+m.id,o=EX.has(k);return card(t.n,`<p class="m1">${who(m.p)}</p><p class="m2">Date: ${fr(m.date)}</p><p class="m3">${t.c} · ${t.min} min · ${m.st}</p>`,`<button class="vb" data-ex="${k}">${o?"Hide agenda":"View agenda"}</button>`,o?`<div class="ex"><b>Agenda</b><ol>${t.ag.map(a=>`<li>${a}</li>`).join("")}</ol><b>Questions</b><ol>${t.q.map(a=>`<li>${a}</li>`).join("")}</ol></div>`:"")}),"No meetings found.")}
function tplPrev(){const t=T($("#tsel").value),f=$("#mf").date.value||d(0);$("#tp").innerHTML=`<b>Cadence: ${t.c}</b> (fixed by the template)<br>Next dates: ${[0,1,2].map(i=>fr(addDays(f,t.days*i))).join(", ")}`}
function evalv(){if(!boss())return head("Evaluation")+panel(null)+cards(vis(S.evals,e=>T(e.type).n).sort((a,b)=>a.date<b.date?1:-1).map(evC),"No evaluation yet.");
let dr={};try{dr=JSON.parse(localStorage.getItem("eval-draft")||"{}")}catch(e){}const v=k=>esc(dr[k]||"");
return head("New evaluation")+`<form id="ef" class="panel" novalidate><div class="two"><div class="f"><label>T1 <span class="req">*</span></label><select name="p">${base().map(s=>`<option value="${s.id}" ${(pre||dr.p)==s.id?"selected":""}>${s.n}</option>`).join("")}</select></div><div class="f"><label>Meeting type <span class="req">*</span></label><select name="type">${TPL.map(t=>`<option value="${t.id}" ${dr.type==t.id?"selected":""}>${t.n}</option>`).join("")}</select></div><div class="f"><label>Date <span class="req">*</span></label><input type="date" name="date" value="${dr.date||d(0)}"></div></div>
${[["res","Results achieved *"],["forces","Observed strengths *"],["amel","Areas to improve *"],["fb","Manager feedback *"],["com","T1 comments"]].map(([k,l])=>`<div class="f"><label>${l}</label><textarea name="${k}" rows="2">${v(k)}</textarea><div class="err" data-e="${k}"></div></div>`).join("")}
<div class="f"><label>Performance level <span class="req">*</span></label><div class="scale">${[1,2,3,4,5].map(n=>`<label><input type="radio" name="score" value="${n}" ${dr.score==n?"checked":""}>${n}</label>`).join("")}</div><div class="err" data-e="score"></div></div>
<div class="two"><div class="f"><label>Priorities for next period</label><input name="prio" value="${v("prio")}"></div><div class="f"><label>Next follow-up <span class="req">*</span></label><input type="date" name="next" value="${dr.next||d(30)}"></div></div>
<div class="f"><label>Action plan (first action)</label><input name="act" value="${v("act")}" placeholder="e.g. follow up 10 prospects before Friday"></div>
<button class="btn">Save evaluation</button> <small style="color:var(--muted)">Draft kept in this browser</small></form>`}
function act(){const L=vis(S.actions,a=>a.d).filter(a=>tab=="all"||stt(a)==tab).sort((a,b)=>a.due>b.due?1:-1);return head("Action plans")+panel([["all","All"],["late","Overdue"],["todo","To do"],["doing","In progress"],["done","Done"]])+cards(L.map(actC),"No actions found.")}
function hist(){const L=vis(S.evals,e=>T(e.type).n).filter(e=>tab=="all"||e.type==tab).sort((a,b)=>a.date<b.date?1:-1);return head("History")+panel([["all","All"],...TPL.slice(0,2).concat(TPL.slice(3,4)).map(t=>[t.id,t.n])])+cards(L.map(evC),"No evaluation recorded.")}
const support=()=>head("Support")+`<div class="panel empty">Need help? Contact your sales excellence team.</div>`;
function render(){nav();$("#main").innerHTML=({dash,team,dir,meet,eval:evalv,act,hist,support})[view]();
const mf=$("#mf");if(mf){$("#tsel").onchange=tplPrev;mf.date.onchange=tplPrev;tplPrev();mf.onsubmit=e=>{e.preventDefault();const f=new FormData(mf);if(!f.get("date"))return toast("Please pick a date.");const tp=T(f.get("t"));[0,1,2].forEach(i=>S.meetings.push({id:Date.now()+i,t:tp.id,p:+f.get("p"),date:addDays(f.get("date"),tp.days*i),st:"planned"}));sched=false;toast("3 meetings created (demo: no reminder sent)");render()}}
const pf=$("#pf");if(pf)pf.onsubmit=e=>{e.preventDefault();toast("Demo: in the real app, this goes to your T2 manager");pf.reset()};
const ef=$("#ef");if(ef){ef.oninput=()=>{try{localStorage.setItem("eval-draft",JSON.stringify(Object.fromEntries(new FormData(ef))))}catch(e){}};
ef.onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(ef));let bad=0;["res","forces","amel","fb","score"].forEach(k=>{const m=f[k]&&String(f[k]).trim()?"":"Required field";ef.querySelector(`[data-e=${k}]`).textContent=m;if(m)bad=1});
if(bad)return toast("Complete the required fields");
S.evals.push({id:Date.now(),p:+f.p,date:f.date,type:f.type,score:+f.score,res:f.res,forces:f.forces,amel:f.amel,fb:f.fb,com:f.com,next:f.next});S.fbs.unshift({p:+f.p,date:f.date,t:f.fb});
if(f.act)S.actions.push({id:Date.now()+1,p:+f.p,d:f.act,due:f.next,st:"todo",pr:"mid"});try{localStorage.removeItem("eval-draft")}catch(e){}toast("Evaluation added to history (demo, not saved)");go("hist")}}}
document.querySelector(".foot").insertAdjacentHTML("beforeend",`<button data-out="1" aria-label="Log out" style="all:unset;cursor:pointer;color:#b5b5b5">${IC.out}</button>`);
if(FEEDBACK_URL){$("#fb").href=FEEDBACK_URL;$("#fb").hidden=false}
render();
</script></body></html>
